  <line x1="170" y1="225" x2="245" y2="225" stroke="#111111" stroke-width="8" stroke-linecap="round"/>
  <line x1="145" y1="285" x2="210" y2="285" stroke="#111111" stroke-width="8" stroke-linecap="round"/>

